[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "RAGA"
version = "0.1.0"
description = "An SOP question-answering application built with FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pypdf",
    "python-multipart",
    "sentence-transformers",
    "qdrant-client",
    "openai>=3.31.0",
]

[project.optional-dependencies]
dev = [
"pytest",
"httpx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
