[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "RAGA"
version = "0.1.0"
description = "An SOP question-answering application built with FastAPI"
requires-python = ">=3.11"
dependencies = [
"fastapi",
"uvicorn[standard]",
"pypdf" ,
"python-multipart", 
"sentence-transformers",
"qdrant-client",
]

[project.optional-dependencies]
dev = [
"pytest",
"httpx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
